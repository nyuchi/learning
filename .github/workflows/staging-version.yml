# Versioning policy (nyuchi/.github#80): every merge into `staging` is
# released as the next PATCH, tagged on the merged commit.
name: Staging version

on:
  push:
    branches: [staging]
  workflow_dispatch:
    inputs:
      bump:
        description: Override the bump (major is only ever manual).
        type: choice
        options: [patch, minor, major]
        default: patch

# Nothing at the workflow level: the one job below asks for the write access
# that tagging needs, and only it.
permissions: {}

jobs:
  version:
    # Only staging: a manual run started from another branch tags nothing.
    if: github.ref == 'refs/heads/staging'
    uses: nyuchi/.github/.github/workflows/reusable-staging-release.yml@8822d18b4f26fbfa6cfc1313138a0287269195b7  # v0.6.0
    with:
      bump: ${{ inputs.bump || '' }}
    permissions:
      contents: write
