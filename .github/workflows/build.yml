name: build

on:
  pull_request:
  push:
    branches: [master, staging]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: astro check + tests + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      # `npm test` runs vitest, builds the site, and then verifies that every
      # inline script in the build is covered by the CSP hash allowlist in
      # vercel.json — so an edit to the theme bootstrap cannot ship a page the
      # browser will refuse to run.
      - name: Tests, build, and CSP check
        run: npm test

  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # The blocking gate. This site compiles to static HTML, so "what ships"
      # is a small tree, and it is expected to stay at zero.
      #
      # scripts/audit.mjs is `npm audit --audit-level=high --omit=dev` with a
      # dated list of advisories set aside by ID (npm audit cannot ignore one).
      # Each entry says why it is safe and when to recheck; past that date the
      # step fails again. Today: GHSA-ch52-4w7c-c8xp (http-cache-semantics, no
      # patched release; astro uses it only at build time), recheck 2026-11-03.
      - name: Audit what ships
        run: node scripts/audit.mjs

      # Build and test tooling, reported but not blocking.
      #
      # vitest currently carries an advisory with no installable fix: every
      # published version up to 4.1.10 is affected, and 4.1.11 — the fix —
      # cannot be installed, because it trips a resolver bug in npm 10.9
      # ("Cannot read properties of null (reading 'edgesOut')") that aborts
      # `npm install` outright. Blocking on it would pin this job red until
      # npm ships a fix, which trains everyone to ignore it. So it is surfaced
      # in the log instead, and this step goes back to blocking the moment
      # vitest 4.1.11 installs cleanly.
      - name: Report advisories in build and test tooling
        continue-on-error: true
        run: npm audit --audit-level=moderate
