name: build

on:
  pull_request:
  push:
    branches: [main, staging]

# Nothing at the workflow level: each job asks for what it uses, and no job
# here pushes, tags or comments, so each reads the repository and no more.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: astro check + tests + build
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so the token is not left in .git/config for
          # every later step (and every npm install script) to read.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      # `npm test` builds the site, runs the tests (vp test), and then verifies
      # that every inline script in the build is covered by the CSP hash
      # allowlist in vercel.json — so an edit to an inline script cannot ship
      # a page the browser will refuse to run.
      - name: Tests, build, and CSP check
        run: npm test

  audit:
    name: npm audit
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so the token is not left in .git/config for
          # every later step (and every npm install script) to read.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # The blocking gate. This site compiles to static HTML, so "what ships"
      # is a small tree, and it is expected to stay at zero.
      #
      # scripts/audit.mjs is `npm audit --audit-level=high --omit=dev` with a
      # dated list of advisories set aside by ID (npm audit cannot ignore one).
      # Each entry says why it is safe and when to recheck; past that date the
      # step fails again. Today: GHSA-ch52-4w7c-c8xp (http-cache-semantics, no
      # patched release; astro uses it only at build time), recheck 2026-11-03.
      - name: Audit what ships
        run: node scripts/audit.mjs

      # Build and test tooling, reported but not blocking. None of it ships:
      # the site is static HTML. Blocking on an advisory in a build tool with
      # no non-breaking fix would pin this job red and train everyone to
      # ignore it, so it is surfaced in the log instead. Today that is
      # postcss-selector-parser, through @tailwindcss/typography.
      - name: Report advisories in build and test tooling
        continue-on-error: true
        run: npm audit --audit-level=moderate
