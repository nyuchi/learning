# Versioning policy (nyuchi/.github#80): every release to `main` is the next
# MINOR, tagged on the merged commit, with a GitHub release. Staging merges are
# patches (staging-version.yml); a major is only ever by hand.
name: Main version

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Override the bump (major is only ever manual).
        type: choice
        options: [minor, major]
        default: minor

# Nothing at the workflow level: the one job below asks for the write access
# that tagging needs, and only it.
permissions: {}

jobs:
  version:
    # Only main: a manual run started from another branch tags nothing.
    if: github.ref == 'refs/heads/main'
    uses: nyuchi/.github/.github/workflows/reusable-auto-tag.yml@0cce12d59c9fbd88025e5e410550fe2fcc68968f  # v0.3.0
    with:
      # Empty: the version is computed from the tags (package.json's version
      # is not the release version).
      version-command: ""
      channel: main
      bump: ${{ inputs.bump || '' }}
      create-release: true
    secrets:
      token: ${{ secrets.RELEASE_BUMP_TOKEN }}
    permissions:
      contents: write
