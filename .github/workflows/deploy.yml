name: deploy

# Merging to master deploys. The build is static, so a deploy uploads dist/ to
# Cloudflare's edge and nothing runs per request.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://learning.nyuchi.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # The same gate CI runs. A deploy that shipped a page whose own inline
      # script the CSP blocks would look fine in the build log and be broken in
      # the browser, so this is checked again on the artefact being uploaded.
      - name: Verify the CSP covers every inline script
        run: npm run csp

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
