# Keeps the actions pinned in .github/workflows current. They are pinned to
# full commit SHAs, with the version in a comment, so a moved tag cannot
# change what runs; Dependabot updates the SHA and the comment together.
#
# npm dependencies are not listed here: no entry existed before, and adding
# one is a separate decision about how many pull requests this repo wants.
version: 2
updates:
  - package-ecosystem: github-actions
    target-branch: "staging"
    directory: /
    schedule:
      interval: weekly
    # A release has a week to be pulled or found bad before a pin moves to it.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
